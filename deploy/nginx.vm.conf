# Based on the actual VM nginx.conf supplied on 2026-10-25.
# Root Compose services: nginx, frontend, backend, database.
# Back up the live file; run nginx -t in the existing nginx container before reloading.
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        image/svg+xml svg svgz;
        application/javascript js;
        text/css css;
    }
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m inactive=60m;
    upstream backend {
        server backend:8080;
    }
    upstream frontend {
        server frontend:80;
    }
    server {
        listen 80;
        server_name simultech.ru www.simultech.ru;
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            types {
                image/png png;
                image/jpg jpg jpeg;
                image/gif gif;
                image/svg+xml svg;
                image/x-icon icon;
                image/webp webp;
                text/css css;
                application/javascript js;
                application/json json;
            }
        }

        location = /swagger-ui.html {
            return 302 /swagger-ui/index.html;
        }

        location ^~ /swagger-ui/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
        }

        # Covers /api-docs AND /api-docs/swagger-config; both must reach Spring.
        location ^~ /api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
        }

        location = /api {
            return 308 /api/;
        }

        location ^~ /api/ {
            # The trailing slash removes /api/ before forwarding to Spring controllers.
            proxy_pass http://backend/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Strip alternative forwarding headers supplied by external clients.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
            client_max_body_size 6m;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    server {
        listen 443 ssl;
        server_name simultech.ru www.simultech.ru;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /swagger-ui.html {
            return 302 /swagger-ui/index.html;
        }

        location ^~ /swagger-ui/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
        }

        # Covers /api-docs AND /api-docs/swagger-config; both must reach Spring.
        location ^~ /api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
        }

        location = /api {
            return 308 /api/;
        }

        location ^~ /api/ {
            # The trailing slash removes /api/ before forwarding to Spring controllers.
            proxy_pass http://backend/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Strip alternative forwarding headers supplied by external clients.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_redirect off;
            client_max_body_size 6m;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
