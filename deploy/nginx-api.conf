# Include this fragment inside the existing nginx server {} block for the API domain.
# In .env: APP_BIND_ADDRESS=127.0.0.1, PUBLIC_API_URL=/api,
# FORWARD_HEADERS_STRATEGY=framework.
# Preserve https://www.simultech.ru/swagger-ui/index.html while API uses /api.
location = /swagger-ui.html {
    return 302 /swagger-ui/index.html;
}

location ^~ /swagger-ui/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_redirect off;
}

# Covers /api-docs AND /api-docs/swagger-config; both must reach Spring.
location ^~ /api-docs {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_redirect off;
}

location = /api {
    return 308 /api/;
}

location ^~ /api/ {
    # The trailing slash removes /api/ before forwarding to Spring controllers.
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Strip alternative forwarding headers supplied by external clients.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_redirect off;
    client_max_body_size 6m;
}
