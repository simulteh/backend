spring.datasource.url=jdbc:h2:mem:netgenius;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensure Hibernate creates and drops schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
springdoc.override-with-generic-response=false
spring.jackson.deserialization.accept-float-as-int=false

# JWT signing secret for tests
app.jwt.secret=c40e168dc7657265c97a10390454a871
server.port=8080

# JWT lifetimes
app.jwt.access-ttl-ms=900000
app.jwt.refresh-ttl-days=30

# Mail: хост задаём, чтобы Spring создал бин JavaMailSender (письма в тестах не отправляются)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=mail@example.test

# Не сидировать демо-данные в тестах
app.seed.labs=false
app.admin.email=admin@netgenius.ru
app.admin.password=Admin12345
