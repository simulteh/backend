# DB
spring.datasource.url=jdbc:postgresql://postgres:5432/netgenius
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Testing / JWT signing secret
testing.app.secret=c40e168dc7657265c97a10390454a871

# JWT lifetimes
app.jwt.access-ttl-ms=900000
app.jwt.refresh-ttl-days=30

# Seed-администратор (создаётся при старте, если отсутствует)
app.admin.email=admin@netgenius.ru
app.admin.password=Admin12345
app.seed.labs=true

# Server
server.port=8080

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/profile-schema.sql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=2
springdoc.override-with-generic-response=false

# Personal cabinets and frontend links
app.frontend-url=${FRONTEND_URL:https://simulteh.com}
app.website-url=${WEBSITE_URL:${app.frontend-url}}
app.teacher-request-email=${TEACHER_REQUEST_EMAIL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.accept-float-as-int=false

