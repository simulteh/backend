# Database (Docker network by default; local profile uses localhost)
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:netgenius}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing secret (base64, generated once and kept in the VM environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-ms=900000
app.jwt.refresh-ttl-days=30

# First administrator. Existing users are not overwritten.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.seed.labs=${SEED_LABS:false}

# Server
server.port=8080
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/profile-schema.sql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# OpenAPI/Swagger Configuration
app.public-api-url=${PUBLIC_API_URL:}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=2
springdoc.override-with-generic-response=false

# Personal cabinets and frontend links
app.frontend-url=${FRONTEND_URL:https://simulteh.com}
app.website-url=${WEBSITE_URL:${app.frontend-url}}
app.teacher-request-email=${TEACHER_REQUEST_EMAIL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.accept-float-as-int=false

# SMTP: 587 + STARTTLS by default; for 465 set SMTP_SSL=true, SMTP_STARTTLS=false.
spring.mail.host=${SMTP_HOST:smtp.yandex.ru}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
app.mail.from=${SMTP_FROM:${spring.mail.username}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
